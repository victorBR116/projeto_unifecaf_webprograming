<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokédex – dados em tempo real da PokéAPI</title>
  <meta name="description" content="Pokédex feita com HTML, CSS e JavaScript puros, consumindo a PokéAPI com fetch.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topo">
    <div class="topo__conteudo">
      <div class="pokebola" id="pokebola" aria-hidden="true">
        <span class="pokebola__botao"></span>
      </div>
      <div>
        <h1 class="topo__titulo">Pokédex</h1>
        <p class="topo__subtitulo">Os dados abaixo são buscados na PokéAPI toda vez que você abre a página.</p>
      </div>
    </div>
  </header>

  <section class="barra" aria-label="Busca e filtros">
    <form class="barra__conteudo" id="form-busca" role="search">
      <label class="barra__campo">
        <span class="visualmente-oculto">Buscar Pokémon por nome ou número</span>
        <input type="search" id="busca" placeholder="Buscar por nome ou número (ex.: pikachu, 25)" autocomplete="off">
      </label>
      <button type="button" class="barra__favoritos" id="btn-favoritos" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.6 4.5 6.3 4.5c2.1 0 3.7 1.2 4.7 2.8l1 1.5 1-1.5c1-1.6 2.6-2.8 4.7-2.8 3.7 0 5.4 3.9 3.9 7.3C19.5 16.4 12 21 12 21z"/></svg>
        <span id="texto-favoritos">Favoritos (0)</span>
      </button>
    </form>
  </section>

  <main class="principal">
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <!-- Esta div começa vazia: todos os cards são criados e inseridos pelo js/script.js -->
    <div class="grade" id="grade"></div>

    <div class="erro" id="erro" role="alert" hidden>
      <p id="erro-texto"></p>
      <button type="button" class="botao" id="btn-tentar-de-novo">Tentar de novo</button>
    </div>

    <div class="mais">
      <button type="button" class="botao" id="btn-mais">Carregar mais Pokémon</button>
    </div>
  </main>

  <footer class="rodape">
    <p>Projeto de Web Development Front-End. Dados: <a href="https://pokeapi.co/" target="_blank" rel="noopener">PokéAPI</a>.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
